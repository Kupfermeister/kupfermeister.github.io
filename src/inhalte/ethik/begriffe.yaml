# Begriffsverzeichnis Ethik – jeder Fachbegriff genau einmal.
# Im Text: <B>Imperativ</B> oder gebeugt <B w="Imperativ">Imperative</B>
Imperativ:
  def: Ein Imperativ ist ein Gebot, also ein Satz, der sagt, was man tun soll.
  erkl: Das Wort kommt vom lateinischen „imperare“ (befehlen). In der Grammatik heißt die Befehlsform eines Verbs Imperativ („Geh!“). In der Ethik meint man damit allgemeiner jede Regel, die ein Sollen ausdrückt – egal, ob sie als Befehl formuliert ist oder nicht.
  erlaeut: „Du sollst nicht lügen“ ist ein Imperativ, obwohl der Satz grammatisch kein Befehl ist. Kant unterscheidet zwei Arten – Imperative, die nur unter einer Bedingung gelten („Wenn du X willst, tu Y“), und einen, der ohne jede Bedingung gilt; das ist der kategorische Imperativ.
Utilitarismus:
  def: Der Utilitarismus ist eine ethische Theorie, nach der eine Handlung genau dann richtig ist, wenn sie das größte Glück für alle Betroffenen hervorbringt.
  erkl: Das Wort kommt vom lateinischen „utilis“ (nützlich). Eine Handlung wird nur nach ihren Folgen für das Wohlergehen aller bewertet. Begründet hat die Theorie Jeremy Bentham, weiterentwickelt John Stuart Mill.
  erlaeut: Soll eine Stadt ein Konzert erlauben? Ein Utilitarist fragt nicht nach Regeln oder Pflichten, sondern prüft, ob die Freude aller Beteiligten ihr Leid überwiegt.
Hedonismus:
  def: Hedonismus ist die Auffassung, dass Freude das einzige in sich Gute und Leid das einzige in sich Schlechte ist.
  erkl: Vom griechischen „hedone“ (Lust, Freude). Gemeint sind nicht nur körperliche Genüsse, sondern alle angenehmen Zustände, auch Zufriedenheit oder Sicherheit. Geld, Gesundheit oder Wissen sind nur gut, weil sie zu Freude führen.
  erlaeut: Bentham ist Hedonist – Freude und Leid sind für ihn der einzige Maßstab für Richtig und Falsch.
Nützlichkeitsprinzip:
  def: Das Nützlichkeitsprinzip ist Benthams oberster moralischer Maßstab – richtig ist die Handlung, die das Glück der Betroffenen insgesamt am stärksten vermehrt.
  erkl: Nützlich ist, was Freude oder Vorteil hervorbringt oder Leid und Unglück verhindert. Beurteilt wird nicht die Absicht, sondern ob die Tendenz zur Glücksvermehrung größer ist als die zur Glücksverminderung.
  erlaeut: Auch „Prinzip der Nützlichkeit“ oder „Prinzip des größten Glücks“ genannt.
Konsequentialismus:
  def: Konsequentialismus ist jede ethische Theorie, die eine Handlung allein nach ihren Folgen beurteilt.
  erkl: Nicht Absicht, Pflicht oder Regel machen eine Handlung gut, sondern nur das, was sie bewirkt. Das Gegenstück ist die Pflichtethik (Deontologie), etwa bei Kant.
  erlaeut: Eine Lüge, die ein Leben rettet, ist für einen Konsequentialisten richtig; für Kant bleibt sie falsch.
hedonistisches Kalkül:
  def: Das hedonistische Kalkül ist Benthams Rechenverfahren, mit dem Freude und Leid aller Betroffenen bewertet, addiert und gegeneinander aufgerechnet werden.
  erkl: „Kalkül“ heißt Berechnung. Jede Freude und jedes Leid wird nach sieben Umständen bewertet – Intensität, Dauer, Gewissheit, Nähe, Folgenträchtigkeit, Reinheit, Ausmaß. Überwiegt insgesamt die Freude, ist die Handlung richtig.
  erlaeut: Bentham sieht darin ein Ideal – man muss nicht immer genau rechnen, sollte sich dem Verfahren aber möglichst annähern.
Folgenträchtigkeit:
  def: Folgenträchtigkeit ist die Eigenschaft einer Freude oder eines Leids, weitere Gefühle derselben Art nach sich zu ziehen.
  erkl: Eine Freude ist folgenträchtig, wenn ihr weitere Freuden folgen, ein Leid, wenn ihm weiteres Leid folgt. Das erhöht den Wert des ersten Gefühls.
  erlaeut: Wer ein Instrument lernt, hat später viele weitere Freuden daran – diese Freude ist folgenträchtig.
Reinheit:
  def: Reinheit ist bei Bentham die Eigenschaft einer Freude oder eines Leids, keine Gefühle der Gegenart nach sich zu ziehen.
  erkl: Eine reine Freude zieht kein Leid nach sich, ein reines Leid keine Freude. Eine unreine Freude ist weniger wert, weil später Leid folgt.
  erlaeut: Ein Rausch ist eine unreine Freude (danach kommt der Kater). Eine Impfung ist ein unreines Leid (danach folgt der Schutz vor Krankheit).
Souverän:
  def: Ein Souverän ist ein Herrscher, über dem keine höhere Macht steht.
  erkl: Vom französischen „souverain“ (oberster). Wer souverän herrscht, muss niemandem Rechenschaft ablegen und kann nicht abgesetzt werden.
  erlaeut: Bentham nennt Freude und Leid „souveräne Gebieter“ – niemand kann sich ihrer Herrschaft entziehen.
Würde:
  def: Würde ist der unbedingte Wert, den jeder Mensch allein deshalb hat, weil er Mensch ist.
  erkl: Bei Kant hat alles entweder einen Preis (es ist austauschbar) oder eine Würde (es ist unersetzlich). Menschen haben Würde und dürfen deshalb nie bloß als Mittel für die Zwecke anderer benutzt werden.
  erlaeut: Grundgesetz Artikel 1 – „Die Würde des Menschen ist unantastbar.“ Darum darf man keinen Einzelnen opfern, nur weil es vielen nützt.
