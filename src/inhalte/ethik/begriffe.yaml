# Begriffsverzeichnis Ethik – jeder Fachbegriff genau einmal.
# Im Text: <B>Imperativ</B> oder gebeugt <B w="Imperativ">Imperative</B>
Imperativ:
  def: Ein Imperativ ist ein Gebot, also ein Satz, der sagt, was man tun soll.
  erkl: Das Wort kommt vom lateinischen „imperare“ (befehlen). In der Grammatik heißt die Befehlsform eines Verbs Imperativ („Geh!“). In der Ethik meint man damit allgemeiner jede Regel, die ein Sollen ausdrückt – egal, ob sie als Befehl formuliert ist oder nicht.
  erlaeut: „Du sollst nicht lügen“ ist ein Imperativ, obwohl der Satz grammatisch kein Befehl ist. Kant unterscheidet zwei Arten – Imperative, die nur unter einer Bedingung gelten („Wenn du X willst, tu Y“), und einen, der ohne jede Bedingung gilt; das ist der kategorische Imperativ.
